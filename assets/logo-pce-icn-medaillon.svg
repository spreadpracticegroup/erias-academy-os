<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">PCE-ICN — Cyber protection, conformité et excellence</title>
  <defs>
